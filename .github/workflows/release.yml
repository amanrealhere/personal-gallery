name: Manual Android Release

run-name: ${{ inputs.run_name || 'Manual release validation' }}

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: 'GitHub Actions run display name'
        required: true
        type: string

      release_title:
        description: 'GitHub Release title'
        required: true
        type: string

      release_tag:
        description: 'Release tag (app-SHORTSHA)'
        required: true
        type: string

      build_date:
        description: 'Build date (YYYY-MM-DD)'
        required: true
        type: string

      release_notes:
        description: 'GitHub Release description'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate selected branch
        env:
          SELECTED_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SELECTED_REF" != "refs/heads/experiment-grid-placeholders" ]]; then
            echo "::error::Release builds are permitted only from experiment-grid-placeholders."
            echo "Selected ref: $SELECTED_REF"
            false
          fi

          echo "Selected branch: experiment-grid-placeholders"

      - name: Validate release metadata
        shell: bash
        env:
          INPUT_RUN_NAME: ${{ inputs.run_name }}
          INPUT_RELEASE_TITLE: ${{ inputs.release_title }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_BUILD_DATE: ${{ inputs.build_date }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          if [[ -z "${INPUT_RUN_NAME//[[:space:]]/}" ]]; then
            echo "::error::run_name cannot be empty."
            false
          fi

          if [[ -z "${INPUT_RELEASE_TITLE//[[:space:]]/}" ]]; then
            echo "::error::release_title cannot be empty."
            false
          fi

          if [[ -z "${INPUT_RELEASE_NOTES//[[:space:]]/}" ]]; then
            echo "::error::release_notes cannot be empty."
            false
          fi

          if [[ ! "$INPUT_RELEASE_TAG" =~ ^app-([0-9a-f]{7})$ ]]; then
            echo "::error::release_tag must use app-SHORTSHA with seven lowercase hexadecimal characters."
            false
          fi

          EXPECTED_TAG="app-${GITHUB_SHA:0:7}"

          if [[ "$INPUT_RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::Release tag does not match the selected commit."
            echo "Expected: $EXPECTED_TAG"
            echo "Received: $INPUT_RELEASE_TAG"
            false
          fi

          python3 - "$INPUT_BUILD_DATE" <<'PY'
          from datetime import date
          import sys

          value = sys.argv[1]

          try:
              parsed = date.fromisoformat(value)
          except ValueError:
              print("::error::build_date must be a valid YYYY-MM-DD date.")
              raise SystemExit(1)

          if parsed.isoformat() != value:
              print("::error::build_date must use YYYY-MM-DD format.")
              raise SystemExit(1)

          print(f"Build date: {value}")
          PY

          echo "Release title: $INPUT_RELEASE_TITLE"
          echo "Release tag: $INPUT_RELEASE_TAG"
          echo "Short SHA: ${GITHUB_SHA:0:7}"
          echo "Full SHA: $GITHUB_SHA"
          echo "Release metadata validation successful."

  build-and-release:
    name: Build, sign and publish APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Verify release keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: "KKKKKK"
        run: |
          set -euo pipefail

          test -f release-key.p12

          keytool -list \
            -keystore release-key.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias personal-gallery \
            > /dev/null

          echo "Release keystore and expected alias verified."

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleRelease

      - name: Align release APK
        id: align
        shell: bash
        env:
          INPUT_BUILD_DATE: ${{ inputs.build_date }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          mapfile -t UNSIGNED_APKS < <(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*-unsigned.apk' \
              -print
          )

          if [[ "${#UNSIGNED_APKS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one unsigned release APK."
            printf 'Found: %s\n' "${UNSIGNED_APKS[@]}"
            false
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK location was not found."
            false
          fi

          BUILD_TOOLS="$SDK_ROOT/build-tools/36.0.0"

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          mkdir -p app/build/tmp

          ALIGNED_APK="app/build/tmp/personal-gallery-aligned.apk"

          "$BUILD_TOOLS/zipalign" \
            -f -v 4 \
            "${UNSIGNED_APKS[0]}" \
            "$ALIGNED_APK"

          BUILD_TIME="$(TZ=Asia/Kolkata date +'%H-%M-%S')"
          APK_NAME="Personal-Gallery_com.amanrealhere.personalgallery_${INPUT_BUILD_DATE}_${BUILD_TIME}_IST_${GITHUB_SHA:0:7}.apk"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: "KKKKKK"
          KEY_PASSWORD: "KKKKKK"
        run: |
          set -euo pipefail

          mkdir -p app/build/outputs/release
          SIGNED_APK="app/build/outputs/release/$APK_NAME"

          "$BUILD_TOOLS/apksigner" sign \
            --ks release-key.p12 \
            --ks-type PKCS12 \
            --ks-key-alias personal-gallery \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$SIGNED_APK"

          test -s "$SIGNED_APK"

          (
            cd "$(dirname "$SIGNED_APK")"
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
            sha256sum --check "$APK_NAME.sha256"
          )

          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"
          echo "APK signature and alignment verification successful."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_title }}
          body: ${{ inputs.release_notes }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            app/build/outputs/release/${{ steps.align.outputs.apk_name }}
            app/build/outputs/release/${{ steps.align.outputs.apk_name }}.sha256

      - name: Report release
        shell: bash
        run: |
          {
            echo "## Release published"
            echo ""
            echo "- Tag: \`${{ inputs.release_tag }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- APK: \`${APK_NAME}\`"
            echo "- SHA-256 checksum included."
          } >> "$GITHUB_STEP_SUMMARY"
